# Intégration continue : à chaque push et pull request.
# backend (lint + tests) | frontend (lint + tests + build).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installation
        run: python -m pip install -r requirements-dev.txt
      - name: Analyse du code (ruff)
        run: ruff check . --output-format github
      - name: Tests (moteur de calcul, droits, workflow, contrat OpenAPI, kit d'authentification)
        run: python -m pytest -q --junitxml=rapport-tests.xml
      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: backend/rapport-tests.xml

  frontend:
    name: Frontend - lint, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Analyse du code (oxlint)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build (typecheck + Vite)
        run: npm run build
